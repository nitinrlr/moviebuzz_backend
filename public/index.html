<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MovieBuzz API</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <h1>MOVIE<span>BUZZ</span> API</h1>
        </header>
        <main>
            <h2>GET /api/movies</h2>
            <p>Returns all movies with their title, year, genre, rating, and image.</p>
            <a href="api/movies/">All Movies</a>

            <h2>POST /api/movies</h2>
            <p>Adds a new movie. Send a title, year, genre, rating, description, and a poster image named "img".</p>
        </main>
    </body>
</html>
